<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/tomphil-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>Tomphil Logistics | Your Logistics. Our Priority. | Zimbabwe & Global Freight</title>
    <meta name="title" content="Tomphil Logistics | Your Logistics. Our Priority. | Zimbabwe & Global Freight" />
    <meta name="description" content="Tomphil Logistics provides professional vehicle clearing, goods customs clearance, and global air, sea & road freight forwarding into and out of Zimbabwe." />
    <meta name="keywords" content="Logistics company Zimbabwe, Customs clearing Zimbabwe, Car clearing Zimbabwe, Goods clearing Zimbabwe, Freight forwarding Zimbabwe, Vehicle clearing Zimbabwe, International logistics Zimbabwe, Shipping from Zimbabwe, Global freight services, Durban to Harare clearing, Beitbridge car clearing" />
    <meta name="author" content="Tomphil Logistics" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0A1931" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tomphil Logistics | Your Logistics. Our Priority." />
    <meta property="og:description" content="Seamless car clearing, goods customs clearance, and global transportation into and out of Zimbabwe." />
    <meta property="og:image" content="/images/og-preview.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Tomphil Logistics | Worldwide Logistics Solutions" />
    <meta property="twitter:description" content="Professional logistics and customs clearance specialists for Zimbabwe and international trade routes." />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LogisticsService",
      "name": "Tomphil Logistics",
      "alternateName": "Tomphil Logistics Zimbabwe",
      "description": "Professional vehicle clearing, goods customs clearance, freight forwarding, and international transportation solutions into and out of Zimbabwe.",
      "url": "https://tomphillogistics.com",
      "logo": "https://tomphillogistics.com/images/tomphil-logo.png",
      "slogan": "Your Logistics. Our Priority.",
      "areaServed": [
        {
          "@type": "Country",
          "name": "Zimbabwe"
        },
        {
          "@type": "AdministrativeArea",
          "name": "Worldwide"
        }
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Logistics & Customs Clearing Services",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Car Clearing (Zimbabwe)"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Goods Customs Clearance"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Air Freight Forwarding"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Sea Freight (FCL & LCL)"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Road Freight Transport"
            }
          }
        ]
      }
    }
    </script>
  </head>
  <body class="bg-white text-slate-800 font-sans antialiased selection:bg-gold-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
